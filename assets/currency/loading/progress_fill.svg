<svg width="200" height="400" viewBox="0 0 200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="liquid_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00BFFF;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#4B92DB;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#9370DB;stop-opacity:0.9" />
    </linearGradient>
    
    <!-- 波浪效果滤镜 -->
    <filter id="wave" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.01 0.05" numOctaves="2" result="turbulence" seed="1"/>
      <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="10" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    
    <!-- 发光效果 -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- 波浪动画 -->
    <animate attributeName="baseFrequency" attributeType="XML"
             values="0.01 0.05;0.015 0.07;0.01 0.05" 
             dur="3s" repeatCount="indefinite" />
  </defs>
  
  <!-- 液体填充 -->
  <rect x="26" y="26" width="148" height="348" rx="10" ry="10" fill="url(#liquid_grad)" filter="url(#wave)" />
  
  <!-- 液体表面波纹 - 带动画 -->
  <path d="M 35,30 C 50,25 70,35 90,30 C 110,25 130,35 150,30" stroke="#B0E0FF" stroke-width="2" fill="none" filter="url(#glow)">
    <animate attributeName="d" 
             values="M 35,30 C 50,25 70,35 90,30 C 110,25 130,35 150,30;
                    M 35,30 C 60,35 80,28 100,33 C 120,38 140,30 150,30;
                    M 35,30 C 50,25 70,35 90,30 C 110,25 130,35 150,30" 
             dur="4s" repeatCount="indefinite" />
  </path>
  
  <path d="M 35,35 C 60,32 80,38 100,35 C 120,32 140,38 160,35" stroke="#B0E0FF" stroke-width="1.5" fill="none" opacity="0.7">
    <animate attributeName="d" 
             values="M 35,35 C 60,32 80,38 100,35 C 120,32 140,38 160,35;
                    M 35,35 C 50,38 70,32 100,38 C 130,32 150,38 160,35;
                    M 35,35 C 60,32 80,38 100,35 C 120,32 140,38 160,35" 
             dur="3.5s" repeatCount="indefinite" />
  </path>
  
  <!-- 液体内部气泡 - 带动画 -->
  <circle cx="50" cy="150" r="3" fill="white" opacity="0.6">
    <animate attributeName="cy" values="150;130;150" dur="5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;0.3;0.6" dur="5s" repeatCount="indefinite" />
  </circle>
  
  <circle cx="120" cy="200" r="2" fill="white" opacity="0.5">
    <animate attributeName="cy" values="200;185;200" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="4s" repeatCount="indefinite" />
  </circle>
  
  <circle cx="80" cy="250" r="4" fill="white" opacity="0.4">
    <animate attributeName="cy" values="250;235;250" dur="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.4;0.2;0.4" dur="6s" repeatCount="indefinite" />
  </circle>
  
  <circle cx="110" cy="100" r="2.5" fill="white" opacity="0.5">
    <animate attributeName="cy" values="100;80;100" dur="4.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.5;0.3;0.5" dur="4.5s" repeatCount="indefinite" />
  </circle>
  
  <!-- 反光效果 -->
  <rect x="30" y="30" width="10" height="340" fill="white" opacity="0.1" />
  <rect x="140" y="30" width="10" height="340" fill="white" opacity="0.05" />
</svg> 