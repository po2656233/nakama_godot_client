<svg width="200" height="400" viewBox="0 0 200 400" xmlns="http://www.w3.org/2000/svg">
  <!-- 容器边框增强 -->
  <rect x="20" y="20" width="160" height="360" rx="15" ry="15" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
  
  <!-- 玻璃反光效果 -->
  <path d="M 26,30 C 40,150 40,250 26,370" stroke="white" stroke-width="1" fill="none" opacity="0.3" />
  <path d="M 174,30 C 160,150 160,250 174,370" stroke="white" stroke-width="1" fill="none" opacity="0.1" />
  
  <!-- 测量刻度标签 -->
  <text x="65" y="303" font-family="Arial" font-size="10" fill="rgba(255,255,255,0.7)">25%</text>
  <text x="65" y="203" font-family="Arial" font-size="10" fill="rgba(255,255,255,0.7)">50%</text>
  <text x="65" y="103" font-family="Arial" font-size="10" fill="rgba(255,255,255,0.7)">75%</text>
  <text x="65" y="53" font-family="Arial" font-size="10" fill="rgba(255,255,255,0.7)">90%</text>
  
  <!-- 顶部盖子效果 -->
  <path d="M 20,20 L 10,10 H 190 L 180,20" fill="#3D5A73" opacity="0.8" />
  <ellipse cx="100" cy="10" rx="90" ry="5" fill="#2A3B4C" />
  
  <!-- 瓶口效果 -->
  <ellipse cx="100" cy="20" rx="80" ry="5" fill="#4B6A83" opacity="0.6" />
  
  <!-- 光晕效果 -->
  <rect x="22" y="22" width="156" height="356" rx="13" ry="13" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="4" />
</svg> 