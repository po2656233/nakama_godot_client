<svg width="200" height="400" viewBox="0 0 200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1A2A3A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2A3B4C;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- 容器背景 -->
  <rect x="20" y="20" width="160" height="360" rx="15" ry="15" fill="url(#bg_grad)" />
  
  <!-- 容器边框 -->
  <rect x="20" y="20" width="160" height="360" rx="15" ry="15" fill="none" stroke="#3D5A73" stroke-width="4" />
  
  <!-- 容器刻度线 -->
  <line x1="40" y1="350" x2="50" y2="350" stroke="#5D7A93" stroke-width="2" />
  <line x1="40" y1="300" x2="60" y2="300" stroke="#5D7A93" stroke-width="2" />
  <line x1="40" y1="250" x2="50" y2="250" stroke="#5D7A93" stroke-width="2" />
  <line x1="40" y1="200" x2="60" y2="200" stroke="#5D7A93" stroke-width="2" />
  <line x1="40" y1="150" x2="50" y2="150" stroke="#5D7A93" stroke-width="2" />
  <line x1="40" y1="100" x2="60" y2="100" stroke="#5D7A93" stroke-width="2" />
  <line x1="40" y1="50" x2="50" y2="50" stroke="#5D7A93" stroke-width="2" />
  
  <!-- 右侧刻度线 -->
  <line x1="160" y1="350" x2="150" y2="350" stroke="#5D7A93" stroke-width="2" />
  <line x1="160" y1="300" x2="140" y2="300" stroke="#5D7A93" stroke-width="2" />
  <line x1="160" y1="250" x2="150" y2="250" stroke="#5D7A93" stroke-width="2" />
  <line x1="160" y1="200" x2="140" y2="200" stroke="#5D7A93" stroke-width="2" />
  <line x1="160" y1="150" x2="150" y2="150" stroke="#5D7A93" stroke-width="2" />
  <line x1="160" y1="100" x2="140" y2="100" stroke="#5D7A93" stroke-width="2" />
  <line x1="160" y1="50" x2="150" y2="50" stroke="#5D7A93" stroke-width="2" />
  
  <!-- 容器玻璃反光效果 -->
  <rect x="30" y="30" width="140" height="340" rx="10" ry="10" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
</svg> 